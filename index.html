<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tugasku" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>Tugasku</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --bg2: #1a1a2e;
      --bg3: #16213e;
      --accent: #e94560;
      --accent2: #f5a623;
      --text: #f0f0f0;
      --text2: #a0a0b8;
      --card: #1e1e35;
      --card2: #252540;
      --done-bg: #12122a;
      --border: rgba(255,255,255,0.07);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      padding: calc(var(--safe-top) + 16px) 20px 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo span { color: var(--accent); }

    .date-chip {
      font-size: 12px;
      color: var(--text2);
      background: var(--card);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    /* Stats */
    .stats {
      display: flex;
      gap: 10px;
    }

    .stat {
      flex: 1;
      background: var(--card);
      border-radius: 12px;
      padding: 10px 14px;
      border: 1px solid var(--border);
    }

    .stat-num {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }

    .stat-num.accent { color: var(--accent); }
    .stat-num.accent2 { color: var(--accent2); }

    .stat-label {
      font-size: 11px;
      color: var(--text2);
      margin-top: 2px;
    }

    /* Progress bar */
    .progress-wrap {
      margin-top: 10px;
      background: var(--card);
      border-radius: 20px;
      height: 4px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 20px;
      transition: width 0.4s ease;
    }

    /* Input area */
    .input-wrap {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .task-input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .task-input:focus { border-color: var(--accent); }
    .task-input::placeholder { color: var(--text2); }

    .add-btn {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: var(--accent);
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .add-btn:active { transform: scale(0.92); background: #c73a52; }

    /* Category pills */
    .cat-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .cat-row::-webkit-scrollbar { display: none; }

    .cat-pill {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text2);
      cursor: pointer;
      transition: all 0.15s;
    }

    .cat-pill.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* Filter tabs */
    .filter-row {
      display: flex;
      gap: 0;
      padding: 12px 20px 0;
    }

    .filter-btn {
      flex: 1;
      padding: 8px;
      background: none;
      border: none;
      color: var(--text2);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }

    .filter-btn.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    /* Task list */
    .list-section {
      padding: 16px 20px;
      padding-bottom: calc(var(--safe-bot) + 20px);
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text2);
      margin-bottom: 10px;
    }

    .task-card {
      background: var(--card);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 12px;
      animation: slideIn 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .task-card.done {
      background: var(--done-bg);
      opacity: 0.7;
    }

    .task-card.done .task-text { text-decoration: line-through; color: var(--text2); }

    .check-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--text2);
      background: none;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      margin-top: 1px;
    }

    .check-btn.done {
      background: var(--accent);
      border-color: var(--accent);
    }

    .check-btn.done::after {
      content: '';
      width: 10px;
      height: 6px;
      border-left: 2px solid white;
      border-bottom: 2px solid white;
      transform: rotate(-45deg) translateY(-1px);
    }

    .task-body { flex: 1; min-width: 0; }

    .task-text {
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
    }

    .task-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
    }

    .task-cat {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 500;
    }

    .cat-kerja  { background: rgba(233,69,96,0.15); color: #e94560; }
    .cat-pribadi { background: rgba(245,166,35,0.15); color: #f5a623; }
    .cat-belanja { background: rgba(82,196,169,0.15); color: #52c4a9; }
    .cat-lainnya { background: rgba(160,160,184,0.15); color: #a0a0b8; }

    .task-time {
      font-size: 11px;
      color: var(--text2);
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--text2);
      cursor: pointer;
      padding: 4px;
      font-size: 16px;
      opacity: 0.4;
      transition: opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
      margin-top: -2px;
    }
    .delete-btn:active { opacity: 1; color: var(--accent); }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 48px 20px;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-title {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .empty-sub {
      font-size: 14px;
      color: var(--text2);
    }

    /* Konfetti */
    .confetti-wrap {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
    }

    .confetti-piece {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo">Tugas<span>ku</span></div>
    <div class="date-chip" id="dateChip"></div>
  </div>
  <div class="stats">
    <div class="stat">
      <div class="stat-num accent" id="totalNum">0</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat">
      <div class="stat-num accent2" id="doneNum">0</div>
      <div class="stat-label">Selesai</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="leftNum">0</div>
      <div class="stat-label">Tersisa</div>
    </div>
  </div>
  <div class="progress-wrap" style="margin-top:10px">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>
</header>

<div class="input-wrap">
  <div class="input-row">
    <input class="task-input" id="taskInput" type="text" placeholder="Tambah tugas baru…" maxlength="120" />
    <button class="add-btn" id="addBtn" aria-label="Tambah tugas">+</button>
  </div>
  <div class="cat-row" id="catRow">
    <div class="cat-pill active" data-cat="lainnya">📌 Lainnya</div>
    <div class="cat-pill" data-cat="kerja">💼 Kerja</div>
    <div class="cat-pill" data-cat="pribadi">🏠 Pribadi</div>
    <div class="cat-pill" data-cat="belanja">🛒 Belanja</div>
  </div>
</div>

<div class="filter-row">
  <button class="filter-btn active" data-filter="semua">Semua</button>
  <button class="filter-btn" data-filter="aktif">Aktif</button>
  <button class="filter-btn" data-filter="selesai">Selesai</button>
</div>

<div class="list-section" id="listSection"></div>

<div class="confetti-wrap" id="confettiWrap"></div>

<script>
  const STORE_KEY = 'tugasku_tasks';
  let tasks = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
  let selectedCat = 'lainnya';
  let activeFilter = 'semua';

  const taskInput = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const listSection = document.getElementById('listSection');
  const catRow = document.getElementById('catRow');
  const dateChip = document.getElementById('dateChip');
  const confettiWrap = document.getElementById('confettiWrap');

  const DAYS = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const MONTHS = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

  function formatDate() {
    const d = new Date();
    return `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`;
  }
  dateChip.textContent = formatDate();

  function save() {
    localStorage.setItem(STORE_KEY, JSON.stringify(tasks));
  }

  function updateStats() {
    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const left = total - done;
    document.getElementById('totalNum').textContent = total;
    document.getElementById('doneNum').textContent = done;
    document.getElementById('leftNum').textContent = left;
    const pct = total === 0 ? 0 : Math.round((done / total) * 100);
    document.getElementById('progressBar').style.width = pct + '%';
  }

  function timeAgo(ts) {
    const diff = Math.floor((Date.now() - ts) / 60000);
    if (diff < 1) return 'baru saja';
    if (diff < 60) return diff + ' mnt lalu';
    const h = Math.floor(diff / 60);
    if (h < 24) return h + ' jam lalu';
    return Math.floor(h / 24) + ' hari lalu';
  }

  function render() {
    let filtered = tasks;
    if (activeFilter === 'aktif') filtered = tasks.filter(t => !t.done);
    if (activeFilter === 'selesai') filtered = tasks.filter(t => t.done);

    listSection.innerHTML = '';

    if (filtered.length === 0) {
      listSection.innerHTML = `
        <div class="empty">
          <div class="empty-icon">${activeFilter === 'selesai' ? '🎉' : '📋'}</div>
          <div class="empty-title">${activeFilter === 'selesai' ? 'Belum ada yang selesai' : 'Daftar kosong'}</div>
          <div class="empty-sub">${activeFilter === 'selesai' ? 'Selesaikan tugasmu!' : 'Tambahkan tugas pertamamu di atas'}</div>
        </div>`;
      updateStats();
      return;
    }

    const active = filtered.filter(t => !t.done);
    const done   = filtered.filter(t => t.done);

    if (active.length > 0) {
      const lbl = document.createElement('div');
      lbl.className = 'section-label';
      lbl.textContent = 'Perlu dikerjakan';
      listSection.appendChild(lbl);
      active.forEach(t => listSection.appendChild(makeCard(t)));
    }

    if (done.length > 0) {
      const lbl = document.createElement('div');
      lbl.className = 'section-label';
      lbl.style.marginTop = active.length ? '20px' : '0';
      lbl.textContent = 'Selesai';
      listSection.appendChild(lbl);
      done.forEach(t => listSection.appendChild(makeCard(t)));
    }

    updateStats();
  }

  function makeCard(task) {
    const card = document.createElement('div');
    card.className = 'task-card' + (task.done ? ' done' : '');
    card.innerHTML = `
      <button class="check-btn ${task.done ? 'done' : ''}" data-id="${task.id}" aria-label="Tandai selesai"></button>
      <div class="task-body">
        <div class="task-text">${escHtml(task.text)}</div>
        <div class="task-meta">
          <span class="task-cat cat-${task.cat}">${catLabel(task.cat)}</span>
          <span class="task-time">${timeAgo(task.ts)}</span>
        </div>
      </div>
      <button class="delete-btn" data-del="${task.id}" aria-label="Hapus">✕</button>`;
    return card;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function catLabel(cat) {
    return {kerja:'💼 Kerja', pribadi:'🏠 Pribadi', belanja:'🛒 Belanja', lainnya:'📌 Lainnya'}[cat] || cat;
  }

  function addTask() {
    const text = taskInput.value.trim();
    if (!text) { taskInput.focus(); return; }
    tasks.unshift({ id: Date.now(), text, cat: selectedCat, done: false, ts: Date.now() });
    save();
    taskInput.value = '';
    render();
    taskInput.focus();
  }

  function toggleTask(id) {
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    t.done = !t.done;
    if (t.done) spawnConfetti();
    save();
    render();
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save();
    render();
  }

  function spawnConfetti() {
    const colors = ['#e94560','#f5a623','#52c4a9','#a78bfa','#60a5fa'];
    for (let i = 0; i < 28; i++) {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.cssText = `
        left: ${Math.random() * 100}vw;
        top: -10px;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        animation-duration: ${0.8 + Math.random() * 0.8}s;
        animation-delay: ${Math.random() * 0.3}s;
        transform: rotate(${Math.random() * 360}deg);
        width: ${6 + Math.random() * 6}px;
        height: ${6 + Math.random() * 6}px;
        border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
      `;
      confettiWrap.appendChild(p);
      p.addEventListener('animationend', () => p.remove());
    }
  }

  addBtn.addEventListener('click', addTask);
  taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

  catRow.addEventListener('click', e => {
    const pill = e.target.closest('.cat-pill');
    if (!pill) return;
    catRow.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    selectedCat = pill.dataset.cat;
  });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      render();
    });
  });

  listSection.addEventListener('click', e => {
    const cb = e.target.closest('.check-btn');
    if (cb) { toggleTask(Number(cb.dataset.id)); return; }
    const db = e.target.closest('.delete-btn');
    if (db) { deleteTask(Number(db.dataset.del)); }
  });

  render();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
